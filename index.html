<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>围棋 · Go</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--txt:#e6e8ec;--muted:#8b93a1;--accent:#4f8cff;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;}
h1{font-size:18px;margin:4px 0 12px;letter-spacing:3px;}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:10px;}
select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;}
button:hover{border-color:var(--accent);}
button:active{transform:translateY(1px);}
.status{display:flex;gap:16px;align-items:center;margin:8px 0;font-size:14px;}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;border:1px solid #0003;}
.dot.b{background:#111;}
.dot.w{background:#fff;}
#res{margin-top:10px;min-height:22px;color:var(--muted);text-align:center;max-width:600px;font-size:13px;}
canvas{background:#e8b974;border-radius:6px;box-shadow:0 6px 24px #0008;touch-action:none;cursor:pointer;}
.hint{color:var(--muted);font-size:12px;margin-top:8px;text-align:center;}
</style>
</head>
<body>
<h1>围 棋 · GO</h1>
<div class="bar">
  <label>模式
    <select id="mode">
      <option value="pvp">人人对弈</option>
      <option value="ai">人机对战</option>
    </select>
  </label>
  <label id="aiSideWrap" style="display:none">电脑执
    <select id="aiSide">
      <option value="W">白（你执黑先）</option>
      <option value="B">黑（你执白后）</option>
    </select>
  </label>
  <label id="aiLevelWrap" style="display:none">难度
    <select id="aiLevel">
      <option value="0">简单</option>
      <option value="1" selected>中等</option>
      <option value="2">困难</option>
    </select>
  </label>
  <label id="engineWrap" style="display:none">引擎
    <select id="engine">
      <option value="heuristic">启发式</option>
      <option value="gnugo">GNU Go（强）</option>
      <option value="katago">KataGo（云端·更强）</option>
    </select>
  </label>
  <label id="katagoWrap" style="display:none">云端 KataGo
    <input id="katagoUrl" placeholder="https://你的后端/move" style="width:170px">
    <input id="katagoToken" placeholder="token(可选)" style="width:80px">
    强度<input type="range" id="katagoStrength" min="1" max="10" value="3" style="vertical-align:middle"><b id="katagoStrengthVal">3</b>s/手
  </label>
  <label>路数
    <select id="size">
      <option value="9">9 路</option>
      <option value="13">13 路</option>
      <option value="19" selected>19 路</option>
    </select>
  </label>
  <label>让子
    <select id="handi">
      <option value="0">0（分先）</option>
      <option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
      <option value="6">6</option><option value="7">7</option>
      <option value="8">8</option><option value="9">9</option>
    </select>
  </label>
  <button id="start">▶ 开始对局</button>
  <button id="new">新对局</button>
  <button id="undo">悔棋</button>
  <button id="pass">停一手</button>
  <button id="score">数子终局</button>
</div>
<div class="status">
  <span><span class="dot b"></span>黑提 <b id="capB">0</b></span>
  <span><span class="dot w"></span>白提 <b id="capW">0</b></span>
  <span>轮到：<b id="turn">黑</b></span>
  <span id="modeLabel"></span>
</div>
<canvas id="board"></canvas>
<div id="res"></div>
<div class="hint">点击「开始对局」开局（黑方先手）· 自动提子 / 禁着 / 打劫 · 人机可选 GNU Go 引擎（接近业余强段，首次需联网下载约 8MB）· 双方各停一手即终局数子</div>
<script>
const B=1, W=2;
let size=19, board, cur, ko, history, caps, passes, handi, scored, terr, started;
let mode='pvp', aiColor=W, aiLevel=1, thinking=false, engine='heuristic';
let moveLog=[]; // gnugo 模式下的真实落子序列 [x(col),y(row),color]，用于回放
let gnugoReady=false, gnugoLoading=false, gnugoFailed=false, gnugoWaiters=[];
let gameId=0; // 防止异步 AI 回调时用户已新开对局
let lastMove=null; // 最近一手 [x,y]，用于闪烁高亮
let rafId=null;     // 闪烁动画循环句柄
const canvas=document.getElementById('board');
const ctx=canvas.getContext('2d');
const res=document.getElementById('res');

function getCw(){ return Math.min(600, Math.max(280, window.innerWidth-32)); }

function handiPoints(n){
  const lo = size===9?2:3, hi = size-1-lo, mid = Math.floor(size/2);
  const pts=[[lo,lo],[hi,lo],[lo,hi],[hi,hi],[lo,mid],[hi,mid],[mid,lo],[mid,hi],[mid,mid]];
  return pts.slice(0,n);
}

function newGame(){
  size=parseInt(document.getElementById('size').value);
  handi=parseInt(document.getElementById('handi').value);
  mode=document.getElementById('mode').value;
  aiColor = document.getElementById('aiSide').value==='W' ? W : B;
  aiLevel = parseInt(document.getElementById('aiLevel').value || '1');
  engine = (mode==='ai') ? document.getElementById('engine').value : 'heuristic';
  moveLog=[];
  gameId++;
  board=Array.from({length:size},()=>Array(size).fill(0));
  for(const [x,y] of handiPoints(handi)) board[x][y]=B;
  // 黑方先手是围棋基本规则：分先黑先；让子局白先（让子摆黑）
  cur = handi>0 ? W : B;
  ko=null; history=[]; caps={1:0,2:0}; passes=0;   scored=false; terr=null; thinking=false; started=false;
  res.textContent='';
  lastMove=null;
  afterMove();
  // 选云端 KataGo 时静默预载 WASM GNU Go，作为云端不可达时的最强本地兜底（不抢提示文案）
  if(engine==='katago') loadGnuGo(null, true);
}

function startGame(){
  if(thinking || started || scored) return;
  started=true;
  res.textContent='';
  lastMove=null;
  afterMove(); // 若电脑执黑，会立即自动落子
}

function neighbors(x,y){
  const r=[];
  if(x>0)r.push([x-1,y]);
  if(x<size-1)r.push([x+1,y]);
  if(y>0)r.push([x,y-1]);
  if(y<size-1)r.push([x,y+1]);
  return r;
}

function getGroupOnBoard(bd,x,y){
  const color=bd[x][y];
  const seen=new Set();
  const st=[[x,y]];
  const group=[];
  let libs=0;
  while(st.length){
    const [cx,cy]=st.pop();
    const k=cx+','+cy;
    if(seen.has(k))continue;
    seen.add(k);
    group.push([cx,cy]);
    for(const [nx,ny] of neighbors(cx,cy)){
      if(bd[nx][ny]===0) libs++;
      else if(bd[nx][ny]===color && !seen.has(nx+','+ny)) st.push([nx,ny]);
    }
  }
  return {group, libs};
}
function getGroup(x,y){ return getGroupOnBoard(board,x,y); }

function tryPlace(x,y){
  if(scored) return;
  if(board[x][y]!==0) return;
  if(ko && ko[0]===x && ko[1]===y) return; // 打劫禁着
  const opp = cur===B ? W : B;
  board[x][y]=cur;
  let removed=[];
  for(const [nx,ny] of neighbors(x,y)){
    if(board[nx][ny]===opp){
      const g=getGroup(nx,ny);
      if(g.libs===0){
        for(const [gx,gy] of g.group){ board[gx][gy]=0; removed.push([gx,gy]); }
      }
    }
  }
  const myg=getGroup(x,y);
  if(myg.libs===0 && removed.length===0){ board[x][y]=0; return; } // 自杀禁着
  if(removed.length===1 && myg.libs===1) ko=[removed[0][0],removed[0][1]];
  else ko=null;
  caps[cur]+=removed.length;
  if(mode==='ai' && engine==='gnugo') moveLog.push([x,y,cur]);
  history.push({board:board.map(r=>r.slice()), cur, ko:ko?ko.slice():null, caps:{...caps}, passes, mll:moveLog.length});
  cur=opp; passes=0;
  lastMove=[x,y]; scheduleFlash();
  afterMove();
}

function undo(){
  if(thinking || !history.length || !started) return;
  let s=history.pop();
  board=s.board.map(r=>r.slice()); cur=s.cur; ko=s.ko?s.ko.slice():null; caps={...s.caps}; passes=s.passes;
  if(mode==='ai'){
    // 回退到"该玩家走"的状态：若撤完仍轮到电脑，再撤一手
    while(history.length && cur===aiColor){
      s=history.pop();
      board=s.board.map(r=>r.slice()); cur=s.cur; ko=s.ko?s.ko.slice():null; caps={...s.caps}; passes=s.passes;
    }
    if(engine==='gnugo') moveLog.length = s.mll; // 保持棋谱与棋盘一致
  }
  scored=false; terr=null; thinking=false;
  res.textContent='';
  lastMove=null;
  afterMove();
}

function pass(){
  if(thinking || scored || !started) return;
  history.push({board:board.map(r=>r.slice()), cur, ko:ko?ko.slice():null, caps:{...caps}, passes, mll:moveLog.length});
  passes++;
  if(passes>=2){ doScore(); return; }
  cur = cur===B ? W : B;
  lastMove=null;
  afterMove();
}

function afterMove(){
  draw(); updateStatus();
  if(mode==='ai' && started && !scored && cur===aiColor){
    res.textContent='电脑思考中…';
    const fn = engine==='gnugo' ? gnugoComputerMove : engine==='katago' ? katagoComputerMove : aiMove;
    const delay = engine==='gnugo' ? 550 : engine==='katago' ? 500 : (aiLevel===2 ? 700 : 450);
    setTimeout(fn, delay);
  } else if(started){
    res.textContent='';
  }
}

function updateStatus(){
  document.getElementById('capB').textContent=caps[B];
  document.getElementById('capW').textContent=caps[W];
  document.getElementById('turn').textContent = started ? (cur===B?'黑':'白') : '—';
  document.getElementById('modeLabel').textContent = mode==='ai'
    ? ('· 人机（电脑执'+(aiColor===B?'黑':'白')+'）')
    : '· 人人对弈';
  document.getElementById('start').disabled = started;
  if(!started && !scored){
    res.textContent='就绪 · 点击「开始对局」（黑方先手）';
  }
}

function totalStonesOnBoard(bd){ let n=0; for(let x=0;x<size;x++)for(let y=0;y<size;y++) if(bd[x][y]!==0) n++; return n; }
function totalStones(){ return totalStonesOnBoard(board); }

function isOwnEyeOnBoard(bd,x,y,color){
  if(bd[x][y]!==0) return false;
  for(const [nx,ny] of neighbors(x,y)){ if(bd[nx][ny]!==color) return false; }
  let enemyDiag=0; const opp=color===B?W:B;
  for(const [dx,dy] of [[1,1],[1,-1],[-1,1],[-1,-1]]){
    const nx=x+dx, ny=y+dy;
    if(nx<0||ny<0||nx>=size||ny>=size) continue;
    if(bd[nx][ny]===opp) enemyDiag++;
  }
  return enemyDiag<=1;
}
function isOwnEye(x,y,color){ return isOwnEyeOnBoard(board,x,y,color); }

// ========== 经典围棋案例库（定式 / 好形 / 愚形 / 方向） ==========
const JOSEKI = {
  // 星位相关定式：黑占星位后，白挂角、黑守角/夹攻的经典应手
  hoshi: {
    // 黑先占星位（4,4 等角部星位）
    corners: (sz)=>{
      if(sz===19) return [[3,3],[15,3],[3,15],[15,15]];
      if(sz===13) return [[3,3],[9,3],[3,9],[9,9]];
      return [[2,2],[6,2],[2,6],[6,6]];
    },
    // 小飞挂角相对星位：挂点在 (dx+1, dy+2) 或其旋转
    keimaMoves: (x,y)=> [[x+1,y+2],[x+2,y+1],[x-1,y+2],[x+2,y-1],[x-1,y-2],[x-2,y+1],[x+1,y-2],[x-2,y-1]],
    // 星位守角/应法：小飞、一间跳、尖顶
    replies: (x,y)=> [[x+2,y+1],[x+1,y+2],[x+2,y+2],[x+3,y+1],[x+1,y+3],[x+1,y+1]]
  }
};

function inBoard(x,y){ return x>=0 && y>=0 && x<size && y<size; }

// 判断 (x,y) 是否在某条边上
function edgeDist(x,y){ return Math.min(x, y, size-1-x, size-1-y); }

// 检查落子后是否形成愚形：空三角、方四、丁四、二路柱子等
function badShapePenalty(bd,x,y,color){
  let pen=0;
  // 空三角：三个同色子呈 L 且无对方棋子贴住拐角
  const lshapes=[
    [[1,0],[0,1],[1,1]], [[1,0],[0,-1],[1,-1]],
    [[-1,0],[0,1],[-1,1]], [[-1,0],[0,-1],[-1,-1]]
  ];
  for(const pts of lshapes){
    const ax=x+pts[0][0], ay=y+pts[0][1];
    const bx=x+pts[1][0], by=y+pts[1][1];
    const cx=x+pts[2][0], cy=y+pts[2][1];
    if(inBoard(ax,ay) && inBoard(bx,by) && inBoard(cx,cy) &&
       bd[ax][ay]===color && bd[bx][by]===color && bd[cx][cy]===color){
      pen += 35; // 空三角
    }
  }
  // 二路爬行惩罚：落子位于二线，且同方向（上下左右）相邻或隔一格还有同色子
  if(edgeDist(x,y)===1){
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(inBoard(nx,ny) && bd[nx][ny]===color && edgeDist(nx,ny)===1) pen += 40;
    }
    pen += 20; // 二线本身就不如三线四线舒展
  }
  // 三线是黄金线，奖励
  if(edgeDist(x,y)===2) pen -= 8;
  // 四线奖励
  if(edgeDist(x,y)===3) pen -= 5;
  return pen;
}

// 好形奖励：小尖、跳、飞、拆二、虎
function goodShapeBonus(bd,x,y,color){
  let bonus=0;
  // 小尖（对角相邻）
  for(const [dx,dy] of [[1,1],[1,-1],[-1,1],[-1,-1]]){
    const nx=x+dx, ny=y+dy;
    if(inBoard(nx,ny) && bd[nx][ny]===color) bonus += 10;
  }
  // 跳 / 拆二
  for(const [dx,dy] of [[2,0],[-2,0],[0,2],[0,-2]]){
    const nx=x+dx, ny=y+dy;
    if(inBoard(nx,ny) && bd[nx][ny]===color) bonus += 14;
  }
  // 小飞
  for(const [dx,dy] of [[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]]){
    const nx=x+dx, ny=y+dy;
    if(inBoard(nx,ny) && bd[nx][ny]===color) bonus += 9;
  }
  // 大飞
  for(const [dx,dy] of [[3,1],[3,-1],[-3,1],[-3,-1],[1,3],[1,-3],[-1,3],[-1,-3]]){
    const nx=x+dx, ny=y+dy;
    if(inBoard(nx,ny) && bd[nx][ny]===color) bonus += 5;
  }
  // 连接/补强自己弱子：附近有自己 1 气棋子时，这手有额外价值
  for(const [nx,ny] of neighbors(x,y)){
    if(bd[nx][ny]===color){
      const g=getGroupOnBoard(bd,nx,ny);
      if(g.libs<=2) bonus += 18;
    }
  }
  return bonus;
}

// 方向与厚势：鼓励往中腹、棋盘中央发展；避免全挤在角上
function directionBonus(bd,x,y,color){
  const opp=color===B?W:B;
  const cx=(size-1)/2, cy=(size-1)/2;
  const toCenter = 1 - (Math.abs(x-cx)+Math.abs(y-cy))/(size-1);
  let bonus = toCenter * 8; // 略往中腹偏
  // 如果这手能堵住对方往中腹的出头，额外加分（封锁）
  for(const [nx,ny] of neighbors(x,y)){
    if(bd[nx][ny]===opp){
      const g=getGroupOnBoard(bd,nx,ny);
      if(g.libs<=3){
        // 对方这块棋往中腹方向的气
        for(const [gx,gy] of g.group){
          for(const [ex,ey] of neighbors(gx,gy)){
            if(bd[ex][ey]===0 && edgeDist(ex,ey)>edgeDist(gx,gy)) bonus += 6;
          }
        }
      }
    }
  }
  return bonus;
}

// 开局定式提示：前 30 手左右按经典占角/挂角/守角给候选点加权
function josekiHint(bd,x,y,color){
  const stones=totalStonesOnBoard(bd);
  if(stones>size*1.6) return 0; // 中盘后不再靠定式
  let h=0;
  const opp=color===B?W:B;
  const hoshiPts = JOSEKI.hoshi.corners(size);
  // 自己还没占角，优先占三三/星位/小目
  const myCorner = hoshiPts.some(([cx,cy])=>bd[cx][cy]===color);
  if(!myCorner && edgeDist(x,y)>=2 && edgeDist(x,y)<=4){
    const d = Math.min(x,y,size-1-x,size-1-y);
    if(d===2 || d===3) h += 25; // 三三/小目/高目附近
  }
  // 对方占星位后，挂角点加分
  for(const [cx,cy] of hoshiPts){
    if(bd[cx][cy]===opp){
      for(const [kx,ky] of JOSEKI.hoshi.keimaMoves(cx,cy)){
        if(inBoard(kx,ky) && kx===x && ky===y) h += 22;
      }
      // 守角/夹攻点
      for(const [rx,ry] of JOSEKI.hoshi.replies(cx,cy)){
        if(inBoard(rx,ry) && rx===x && ry===y) h += 14;
      }
    }
  }
  // 己方占星位后，对方挂角时守角
  for(const [cx,cy] of hoshiPts){
    if(bd[cx][cy]===color){
      for(const [rx,ry] of JOSEKI.hoshi.replies(cx,cy)){
        if(inBoard(rx,ry) && rx===x && ry===y) h += 12;
      }
    }
  }
  return h;
}

// 启发式评估某空点对本色落子的价值（board-aware 版本，用于多步搜索）
function evalPointOnBoard(bd,koPoint,x,y,color, useShape=true){
  if(bd[x][y]!==0) return -1e9;
  if(koPoint && koPoint[0]===x && koPoint[1]===y) return -1e9;
  const opp = color===B ? W : B;
  bd[x][y]=color;
  let cap=0;
  for(const [nx,ny] of neighbors(x,y)){
    if(bd[nx][ny]===opp){
      const g=getGroupOnBoard(bd,nx,ny);
      if(g.libs===0) cap += g.group.length;
    }
  }
  const myg=getGroupOnBoard(bd,x,y);
  const libs=myg.libs;
  if(libs===0 && cap===0){ bd[x][y]=0; return -1e9; } // 自杀禁着
  let s = 0;
  if(cap>0){ s += 1000 + cap*100 + libs*3; } // 优先吃子
  else { s += libs*4; }                      // 没吃子则看重自己气数
  if(cap===0 && libs<=1) s -= 800;           // 避免无意义的送吃（self-atari）
  if(isOwnEyeOnBoard(bd,x,y,color)) s -= 450; // 不填自己的眼
  let ownN=0, enN=0;
  for(const [nx,ny] of neighbors(x,y)){
    if(bd[nx][ny]===color) ownN++;
    else if(bd[nx][ny]===opp) enN++;
  }
  s += ownN*3 - enN*2;
  if(totalStonesOnBoard(bd) < size){ // 开局占角偏好
    const d=Math.min(x,y,size-1-x,size-1-y);
    s += (size-1-d)*0.5;
  }
  if(useShape){
    s -= badShapePenalty(bd,x,y,color);
    s += goodShapeBonus(bd,x,y,color);
    s += directionBonus(bd,x,y,color);
    s += josekiHint(bd,x,y,color);
  }
  s += Math.random()*1.5;
  bd[x][y]=0;
  return s;
}
function evalPoint(x,y,color){ return evalPointOnBoard(board,ko,x,y,color); }

function cloneBoard(bd){ return bd.map(r=>r.slice()); }

function isLegalOnBoard(bd,koPoint,x,y,color){
  if(x<0||y<0||x>=size||y>=size) return false;
  if(bd[x][y]!==0) return false;
  if(koPoint && koPoint[0]===x && koPoint[1]===y) return false;
  const opp=color===B?W:B;
  bd[x][y]=color;
  let captured=false;
  for(const [nx,ny] of neighbors(x,y)){
    if(bd[nx][ny]===opp){
      const g=getGroupOnBoard(bd,nx,ny);
      if(g.libs===0) captured=true;
    }
  }
  const myg=getGroupOnBoard(bd,x,y);
  const legal = myg.libs>0 || captured;
  bd[x][y]=0;
  return legal;
}

function selfAtariOnBoard(bd,koPoint,x,y,color){
  if(!isLegalOnBoard(bd,koPoint,x,y,color)) return false;
  const opp=color===B?W:B;
  bd[x][y]=color;
  let cap=0;
  for(const [nx,ny] of neighbors(x,y)){
    if(bd[nx][ny]===opp){
      const g=getGroupOnBoard(bd,nx,ny);
      if(g.libs===0) cap += g.group.length;
    }
  }
  const myg=getGroupOnBoard(bd,x,y);
  const libs=myg.libs;
  bd[x][y]=0;
  if(libs===0 && cap===0) return false; // 自杀不是 self-atari，是非法
  return cap===0 && libs<=1;
}

function placeOnBoard(bd,koPoint,x,y,color){
  if(!isLegalOnBoard(bd,koPoint,x,y,color)) return null;
  const opp=color===B?W:B;
  const newBd=cloneBoard(bd);
  newBd[x][y]=color;
  let removed=[];
  for(const [nx,ny] of neighbors(x,y)){
    if(newBd[nx][ny]===opp){
      const g=getGroupOnBoard(newBd,nx,ny);
      if(g.libs===0){
        for(const [gx,gy] of g.group){ newBd[gx][gy]=0; removed.push([gx,gy]); }
      }
    }
  }
  const myg=getGroupOnBoard(newBd,x,y);
  let newKo=null;
  if(removed.length===1 && myg.libs===1) newKo=[removed[0][0],removed[0][1]];
  return {bd:newBd, ko:newKo, removed, legal:true};
}

// 找到能救自己 1 气棋子的点（防御点），返回 Map<x,y -> 价值>
function defenseMoves(bd,color){
  const saves=new Map();
  for(let x=0;x<size;x++)for(let y=0;y<size;y++){
    if(bd[x][y]!==color) continue;
    const g=getGroupOnBoard(bd,x,y);
    if(g.libs!==1) continue;
    const libSet=new Set();
    for(const [cx,cy] of g.group){
      for(const [nx,ny] of neighbors(cx,cy)){
        if(bd[nx][ny]===0) libSet.add(nx+','+ny);
      }
    }
    for(const k of libSet){
      saves.set(k, (saves.get(k)||0) + g.group.length*12 + 100);
    }
  }
  return saves;
}

function evaluateBoardPos(bd,color){
  const opp=color===B?W:B;
  let myStones=0, oppStones=0, myLibs=0, oppLibs=0;
  const seenMy=new Set(), seenOpp=new Set();
  for(let x=0;x<size;x++)for(let y=0;y<size;y++){
    const k=x+','+y;
    if(bd[x][y]===color && !seenMy.has(k)){
      const g=getGroupOnBoard(bd,x,y);
      for(const [cx,cy] of g.group) seenMy.add(cx+','+cy);
      myStones += g.group.length;
      myLibs += g.libs;
    } else if(bd[x][y]===opp && !seenOpp.has(k)){
      const g=getGroupOnBoard(bd,x,y);
      for(const [cx,cy] of g.group) seenOpp.add(cx+','+cy);
      oppStones += g.group.length;
      oppLibs += g.libs;
    }
  }
  // 全局棋形/方向评估
  let myShape=0, oppShape=0;
  for(let x=0;x<size;x++)for(let y=0;y<size;y++){
    if(bd[x][y]===color){
      myShape += goodShapeBonus(bd,x,y,color) - badShapePenalty(bd,x,y,color) + directionBonus(bd,x,y,color);
    } else if(bd[x][y]===opp){
      oppShape += goodShapeBonus(bd,x,y,opp) - badShapePenalty(bd,x,y,opp) + directionBonus(bd,x,y,opp);
    }
  }
  return (myStones - oppStones)*8 + (myLibs - oppLibs)*3 + (myShape - oppShape)*0.6;
}

function aiBestEasy(){
  const legal=[];
  for(let x=0;x<size;x++)for(let y=0;y<size;y++){
    if(isLegalOnBoard(board,ko,x,y,aiColor)) legal.push({x,y});
  }
  if(!legal.length) return {best:null, bs:-Infinity};
  legal.sort((a,b)=>{
    const sa=selfAtariOnBoard(board,ko,a.x,a.y,aiColor)?1:0;
    const sb=selfAtariOnBoard(board,ko,b.x,b.y,aiColor)?1:0;
    if(sa!==sb) return sa-sb; // 无意义的 self-atari 排到后面
    return Math.random()-0.5;
  });
  const pool=legal.slice(0, Math.max(1, Math.ceil(legal.length*0.25)));
  const pick=pool[Math.floor(Math.random()*pool.length)];
  return {best:[pick.x,pick.y], bs:0};
}

function aiBestMedium(){
  const saves=defenseMoves(board, aiColor);
  const moves=[];
  for(let x=0;x<size;x++)for(let y=0;y<size;y++){
    const s=evalPoint(x,y,aiColor) + (saves.get(x+','+y)||0);
    if(s>-1e8) moves.push({x,y,s});
  }
  if(!moves.length) return {best:null, bs:-Infinity};
  moves.sort((a,b)=>b.s-a.s);
  const top=moves.slice(0, Math.min(7, moves.length));
  const pick=top[Math.floor(Math.random()*top.length)];
  return {best:[pick.x,pick.y], bs:pick.s};
}

function aiBestHard(){
  const opp=aiColor===B?W:B;
  const saves=defenseMoves(board, aiColor);
  const fillRatio=totalStones()/(size*size); // 终局判定
  const cands=[];
  for(let x=0;x<size;x++)for(let y=0;y<size;y++){
    if(!isLegalOnBoard(board,ko,x,y,aiColor)) continue;
    if(isOwnEye(x,y,aiColor)) continue; // 不填自己的眼
    let s=evalPoint(x,y,aiColor) + (saves.get(x+','+y)||0);
    if(fillRatio>0.5){
      // 终局：偏好填单官(dame)/收官，远离棋子的确定地不填，避免"乱下"
      let adjB=0,adjW=0,adjE=0;
      for(const [nx,ny] of neighbors(x,y)){
        if(board[nx][ny]===B) adjB++; else if(board[nx][ny]===W) adjW++; else adjE++;
      }
      if(adjB>0 && adjW>0) s += 300;       // 填双方都挨着的单官，最高优先
      else if(adjW>0 && adjB===0) s += 90;  // 进对方空收官
      else if(adjB>0 && adjE>0) s += 40;    // 连自己空边
      else s -= 120;                         // 远离棋子的空点（多已确定地，不必填）
    }
    if(s>-1e8) cands.push({x,y,s});
  }
  cands.sort((a,b)=>b.s-a.s);
  const topCands=cands.slice(0, Math.min(24, cands.length));
  let results=[];
  for(const c of topCands){
    const r1=placeOnBoard(board,ko,c.x,c.y,aiColor);
    if(!r1) continue;
    // 1-ply：对手最佳应手
    const oppSaves=defenseMoves(r1.bd, opp);
    let ob=null, obs=-Infinity;
    for(let ox=0;ox<size;ox++)for(let oy=0;oy<size;oy++){
      if(!isLegalOnBoard(r1.bd, r1.ko, ox, oy, opp)) continue;
      const os=evalPointOnBoard(r1.bd, r1.ko, ox, oy, opp) + (oppSaves.get(ox+','+oy)||0);
      if(os>obs){ obs=os; ob={x:ox,y:oy}; }
    }
    let finalBd=r1.bd, afterOppKo=r1.ko;
    if(ob){
      const r2=placeOnBoard(r1.bd, r1.ko, ob.x, ob.y, opp);
      if(r2){ finalBd=r2.bd; afterOppKo=r2.ko; }
    }
    // 2-ply：自己再应一手（用于判断后续发展潜力）
    const mySaves2=defenseMoves(finalBd, aiColor);
    let me2=null, me2s=-Infinity;
    for(let mx=0;mx<size;mx++)for(let my=0;my<size;my++){
      if(!isLegalOnBoard(finalBd, afterOppKo, mx, my, aiColor)) continue;
      const ms=evalPointOnBoard(finalBd, afterOppKo, mx, my, aiColor) + (mySaves2.get(mx+','+my)||0);
      if(ms>me2s){ me2s=ms; me2={x:mx,y:my}; }
    }
    if(me2){
      const r3=placeOnBoard(finalBd, afterOppKo, me2.x, me2.y, aiColor);
      if(r3) finalBd=r3.bd;
    }
    const val=evaluateBoardPos(finalBd, aiColor) + c.s*0.08 + Math.random()*0.5;
    results.push({x:c.x, y:c.y, val});
  }
  if(!results.length) return {best:null, bs:-Infinity};
  results.sort((a,b)=>b.val-a.val);
  const topRes=results.slice(0, Math.min(4, results.length));
  const pick=topRes[Math.floor(Math.random()*topRes.length)];
  return {best:[pick.x,pick.y], bs:pick.val};
}

function aiMove(){
  if(mode!=='ai' || engine==='gnugo' || scored || thinking || cur!==aiColor || !started) return;
  thinking=true;
  let r;
  if(aiLevel===0) r=aiBestEasy();
  else if(aiLevel===1) r=aiBestMedium();
  else r=aiBestHard();
  thinking=false;
  if(r.best && r.bs>-600) tryPlace(r.best[0],r.best[1]);
  else pass();
}

// ========== GNU Go 引擎（强业余~初段，纯前端 WASM，跑在 Web Worker） ==========
// 设计：GNU Go 仅作"走子建议器"——在 Worker 中每回合重新初始化并回放棋谱，
// 让它为电脑方算出一手坐标；棋盘真相/提子/打劫/停一手/悔棋/数子仍用本页规则引擎。
// 用 Worker 是为了避免 _genNextStep() 同步阻塞主线程 UI。
function komiVal(){ return handi>0 ? 0 : (size>=13 ? 7.5 : 5.5); }

let gnugoWorker=null;
let gnugoMsgId=0;
const gnugoPromises=new Map(); // id -> {resolve,reject}

function makeWorker(){
  if(gnugoWorker) return gnugoWorker;
  try{
    gnugoWorker = new Worker('./gnugo.worker.js');
    gnugoWorker.onmessage = function(e){
      const d=e.data || {};
      if(d.type==='ready'){
        gnugoReady=true; gnugoLoading=false;
        const ws=gnugoWaiters; gnugoWaiters=[];
        ws.forEach(f=>f&&f(true));
        return;
      }
      if(d.type==='pong') return;
      const p=gnugoPromises.get(d.id);
      if(!p) return;
      gnugoPromises.delete(d.id);
      if(d.type==='suggest') p.resolve(d.result || {error:'empty'});
      else p.resolve({error:d.error||'worker error', fallback:true});
    };
    gnugoWorker.onerror = function(err){
      console.error('GNU Go Worker error', err);
      gnugoFailed=true; gnugoLoading=false; gnugoReady=false;
      res.textContent='⚠️ GNU Go 引擎加载失败，已自动切回启发式 AI。';
      const ws=gnugoWaiters; gnugoWaiters=[]; ws.forEach(f=>f&&f(false));
      // 拒绝所有 pending promise
      for(const [id,p] of gnugoPromises) p.resolve({error:'worker error', fallback:true});
      gnugoPromises.clear();
    };
    gnugoWorker.onmessageerror = function(e){
      console.error('GNU Go Worker message error', e);
    };
  } catch(e){
    console.error('create worker failed', e);
    gnugoFailed=true; gnugoLoading=false;
  }
  return gnugoWorker;
}

function workerCall(action, payload, timeoutMs=60000){
  const w=makeWorker();
  if(!w || gnugoFailed) return Promise.resolve({error:'worker unavailable', fallback:true});
  const id=++gnugoMsgId;
  return new Promise((resolve)=>{
    gnugoPromises.set(id, {resolve});
    w.postMessage({id, action, ...payload});
    if(timeoutMs){
      setTimeout(()=>{
        if(gnugoPromises.has(id)){
          gnugoPromises.delete(id);
          resolve({error:'timeout', fallback:true});
        }
      }, timeoutMs);
    }
  });
}

function loadGnuGo(cb, silent){
  if(gnugoReady){ cb&&cb(true); return; }
  if(gnugoFailed){ cb&&cb(false); return; }
  gnugoWaiters.push(cb);
  if(gnugoLoading) return;
  gnugoLoading=true;
  if(!silent) res.textContent='正在加载 GNU Go 引擎（约 8MB，首次需联网）…';
  makeWorker();
  // worker onmessage ready 会回调所有 waiter；给个兜底超时
  setTimeout(()=>{
    if(!gnugoReady && gnugoWaiters.length){
      gnugoFailed=true; gnugoLoading=false;
      res.textContent='⚠️ GNU Go 引擎加载超时，已自动切回启发式 AI。';
      const ws=gnugoWaiters; gnugoWaiters=[]; ws.forEach(f=>f&&f(false));
    }
  }, 30000);
}

// 让 GNU Go 为 color 方给出一手坐标；返回 Promise<{x,y} | {pass:true} | {error,fallback}>
function gnugoSuggest(color){
  if(!gnugoReady) return Promise.resolve({error:'not ready', fallback:true});
  return workerCall('suggest', {size, komi:komiVal(), handi, moveLog, color});
}

// 终局/残局：找一个"安全且有价值"的着法——填单官(dame)、进对方空收官、提子；
// 绝不走 self-atari（送吃）或填自己的眼。返回 [x,y] 或 null（无安全点）。
function dameFillMove(){
  const opp=aiColor===B?W:B;
  let best=null, bestS=-1e9;
  for(let x=0;x<size;x++)for(let y=0;y<size;y++){
    if(board[x][y]!==0) continue;
    if(ko && ko[0]===x && ko[1]===y) continue;
    if(isOwnEye(x,y,aiColor)) continue;
    const r=placeOnBoard(board,ko,x,y,aiColor);
    if(!r) continue;
    const cap=r.removed.length;
    const g=getGroupOnBoard(r.bd,x,y);
    if(g.libs===0 && cap===0) continue;   // 自杀禁着
    if(g.libs<=1 && cap===0) continue;    // self-atari 送吃，跳过
    let adjB=0,adjW=0,adjE=0;
    for(const [nx,ny] of neighbors(x,y)){
      if(board[nx][ny]===B) adjB++; else if(board[nx][ny]===W) adjW++; else adjE++;
    }
    let s = cap*1000 + g.libs*3;
    if(adjB>0 && adjW>0) s += 200;       // 填单官（双方都挨着的空），最优先
    else if(adjW>0 && adjB===0) s += 60; // 进对方空收官
    else if(adjB>0 && adjE>0) s += 25;   // 连自己空边
    else s -= 50;                         // 远离棋子的确定地，不必填
    if(s>bestS){ bestS=s; best=[x,y]; }
  }
  return best;
}

// GNU Go 本次不可用时的兜底：仅本手用强启发式顶替，下一手仍重试 GNU Go（不永久切换引擎）
function heuristicFallbackMove(){
  let mv, bs=-Infinity;
  if(aiLevel===2){ const r=aiBestHard(); mv=r.best; bs=r.bs; }
  else if(aiLevel===1){ const r=aiBestMedium(); mv=r.best; bs=r.bs; }
  else { const r=aiBestEasy(); mv=r.best; bs=r.bs; }
  const dame=dameFillMove();
  if((!mv || bs<=-600) && dame){ mv=dame; bs=1; }
  if(mv) tryPlace(mv[0],mv[1]);
  else pass();
}

async function gnugoComputerMove(force){
  if(mode!=='ai' || (engine!=='gnugo' && !force) || scored || cur!==aiColor || !started) return;
  if(gnugoFailed){ heuristicFallbackMove(); return; }
  if(!gnugoReady){ loadGnuGo(ok=>{ if(ok) gnugoComputerMove(); else heuristicFallbackMove(); }); return; }
  const thisGame = gameId;
  thinking=true;
  const sug = await gnugoSuggest(aiColor);
  thinking=false;
  if(thisGame!==gameId || !started || scored) return; // 等待期间用户可能新开了对局
  if(sug.error || sug.fallback){
    // 仅本手用启发式顶替，下一手继续尝试 GNU Go（不再永久切走导致整盘乱下）
    heuristicFallbackMove(); return;
  }
  if(sug.pass){
    // GNU Go 想停：若还有单官(dame)可安全填，则继续填，避免过早终局/浪费手数
    const dame=dameFillMove();
    if(dame){ tryPlace(dame[0],dame[1]); }
    else { gnugoPass(); }
    return;
  }
  const bx=sug.x, by=sug.y;
  if(bx==null || by==null){
    const d=dameFillMove(); if(d) tryPlace(d[0],d[1]); else gnugoPass();
    return;
  }
  tryPlace(bx, by);
  if(board[bx][by]!==aiColor){ // 罕见：建议手被本页规则拒（如劫），退回安全填子
    const d=dameFillMove(); if(d) tryPlace(d[0],d[1]); else pass();
  }
}

function gnugoPass(){
  passes++;
  if(passes>=2){ doScore(); return; }
  cur=(cur===B?W:B);
  res.textContent='电脑停一手';
  afterMove();
}

// 云端 KataGo 不可达时的兜底：优先用已加载的 WASM GNU Go（强于启发式），否则降级启发式。
// 这样即使云端没起，选 KataGo 也会自动退到当前最强本地引擎，而不是退回弱算法。
function katagoFallback(){
  if(gnugoReady){ gnugoComputerMove(true); return; }
  if(!gnugoFailed){ loadGnuGo(ok=>{ if(ok) gnugoComputerMove(true); else heuristicFallbackMove(); }); return; }
  heuristicFallbackMove();
}

// 云端 KataGo：把当前棋盘状态 POST 到后端 /move，拿回 {x,y} 或 pass。
// 后端不可达/超时 → 本手用强启发式兜底（下一手继续尝试云端，不永久切走）。
async function katagoComputerMove(){
  if(mode!=='ai' || engine!=='katago' || scored || cur!==aiColor || !started) return;
  const url = (document.getElementById('katagoUrl').value||'').trim().replace(/\/+$/,'');
  if(!url){ res.textContent='⚠️ 未填 KataGo 后端 URL，已用本地 GNU Go 兜底。'; katagoFallback(); return; }
  const thisGame = gameId;
  thinking=true; draw();
  const color = aiColor===B ? 'black' : 'white';
  const strength = parseInt(document.getElementById('katagoStrength').value||'3',10) || 3;
  const token = (document.getElementById('katagoToken').value||'').trim();
  const body = JSON.stringify({size, komi:komiVal(), handi, moveLog, color, strength});
  try{
    const headers={'Content-Type':'application/json'};
    if(token) headers['Authorization']='Bearer '+token;
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(), 60000);
    const resp=await fetch(url+'/move', {method:'POST', headers, body, signal:ctrl.signal});
    clearTimeout(t);
    const data=await resp.json();
    if(thisGame!==gameId || !started || scored) return;
    if(data.error || (data.x===undefined && !data.pass)) throw new Error(data.error||'no move');
    if(data.pass){
      const dame=dameFillMove();
      if(dame){ tryPlace(dame[0],dame[1]); }
      else { pass(); }
      return;
    }
    const bx=data.x, by=data.y;
    tryPlace(bx, by);
    if(board[bx][by]!==aiColor){
      const d=dameFillMove(); if(d) tryPlace(d[0],d[1]); else pass();
    }
  }catch(e){
    if(thisGame!==gameId) return;
    res.textContent='⚠️ 云端 KataGo 不可达，本手用本地 GNU Go 兜底。';
    katagoFallback();
  } finally {
    thinking=false; draw();
  }
}

function doScore(){
  if(thinking || !started) return;
  scored=true;
  lastMove=null;
  terr=Array.from({length:size},()=>Array(size).fill(0));
  let tB=0,tW=0,neu=0;
  const seen=Array.from({length:size},()=>Array(size).fill(false));
  for(let x=0;x<size;x++)for(let y=0;y<size;y++){
    if(board[x][y]!==0||seen[x][y])continue;
    const st=[[x,y]]; const reg=[]; let b=false,w=false; seen[x][y]=true;
    while(st.length){
      const [cx,cy]=st.pop(); reg.push([cx,cy]);
      for(const [nx,ny] of neighbors(cx,cy)){
        if(board[nx][ny]===0 && !seen[nx][ny]){ seen[nx][ny]=true; st.push([nx,ny]); }
        else if(board[nx][ny]===B) b=true;
        else if(board[nx][ny]===W) w=true;
      }
    }
    if(b&&!w){ for(const [gx,gy] of reg) terr[gx][gy]=B; tB+=reg.length; }
    else if(w&&!b){ for(const [gx,gy] of reg) terr[gx][gy]=W; tW+=reg.length; }
    else neu+=reg.length;
  }
  let cB=0,cW=0;
  for(let x=0;x<size;x++)for(let y=0;y<size;y++){
    if(board[x][y]===B)cB++; else if(board[x][y]===W)cW++;
  }
  const black=cB+tB, white=cW+tW;
  const komi = komiVal();
  const bAdj = black - komi;
  let msg;
  if(bAdj>white) msg=`黑胜 ${(bAdj-white).toFixed(2)} 子`;
  else if(white>bAdj) msg=`白胜 ${(white-bAdj).toFixed(2)} 子`;
  else msg=`和棋`;
  res.textContent=
    `终局 · ${msg}　|　黑子${cB} 黑地${tB}　白子${cW} 白地${tW}　单官${neu}　（黑贴${komi}子）`;
  draw();
}

function starList(){
  const s=size;
  if(s===19) return [[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]];
  if(s===13) return [[3,3],[3,9],[9,3],[9,9],[6,6]];
  return [[2,2],[2,6],[6,2],[6,6],[4,4]];
}

function draw(){
  const cw=getCw();
  const dpr=window.devicePixelRatio||1;
  canvas.style.width=cw+'px'; canvas.style.height=cw+'px';
  canvas.width=Math.round(cw*dpr); canvas.height=Math.round(cw*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const pad=cw*0.045;
  const grid=(cw-2*pad)/(size-1);
  ctx.fillStyle='#e8b974'; ctx.fillRect(0,0,cw,cw);
  ctx.strokeStyle='#5a3a17'; ctx.lineWidth=1;
  for(let i=0;i<size;i++){
    ctx.beginPath(); ctx.moveTo(pad,pad+i*grid); ctx.lineTo(cw-pad,pad+i*grid); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad+i*grid,pad); ctx.lineTo(pad+i*grid,cw-pad); ctx.stroke();
  }
  ctx.fillStyle='#3a2410';
  for(const [sx,sy] of starList()){
    ctx.beginPath(); ctx.arc(pad+sx*grid, pad+sy*grid, grid*0.12, 0, 7); ctx.fill();
  }
  if(scored && terr){
    for(let x=0;x<size;x++)for(let y=0;y<size;y++){
      if(terr[x][y]===0) continue;
      ctx.fillStyle = terr[x][y]===B ? '#1118' : '#fff9';
      ctx.beginPath(); ctx.arc(pad+x*grid, pad+y*grid, grid*0.16, 0, 7); ctx.fill();
    }
  }
  for(let x=0;x<size;x++)for(let y=0;y<size;y++){
    if(board[x][y]===0) continue;
    const px=pad+x*grid, py=pad+y*grid, r=grid*0.46;
    const g=ctx.createRadialGradient(px-r*0.3, py-r*0.3, r*0.1, px, py, r);
    if(board[x][y]===B){ g.addColorStop(0,'#555'); g.addColorStop(1,'#000'); }
    else { g.addColorStop(0,'#fff'); g.addColorStop(1,'#cfcfcf'); }
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,r,0,7); ctx.fill();
  }
  // 最近一手闪烁高亮（红环 + 中心点），让玩家看清刚下在哪
  if(lastMove && !scored && inBoard(lastMove[0],lastMove[1]) && board[lastMove[0]][lastMove[1]]!==0){
    const [lx,ly]=lastMove;
    const px=pad+lx*grid, py=pad+ly*grid, r=grid*0.46;
    const t=(Math.sin(performance.now()/220)+1)/2; // 0..1 呼吸闪烁
    ctx.save();
    ctx.lineWidth=2+2.5*t;
    ctx.strokeStyle='rgba(255,64,64,'+(0.45+0.5*t)+')';
    ctx.beginPath(); ctx.arc(px,py, r+3+2*t, 0, 7); ctx.stroke();
    ctx.fillStyle='rgba(255,64,64,'+(0.6+0.4*t)+')';
    ctx.beginPath(); ctx.arc(px,py, grid*0.12, 0, 7); ctx.fill();
    ctx.restore();
  }
}

function scheduleFlash(){
  if(rafId!==null) return;
  const tick=()=>{
    rafId=null;
    draw();
    if(lastMove && !scored){ rafId=requestAnimationFrame(tick); }
  };
  rafId=requestAnimationFrame(tick);
}

function syncModeUI(){
  const isAi = document.getElementById('mode').value==='ai';
  const eng = document.getElementById('engine').value;
  document.getElementById('aiSideWrap').style.display = isAi ? 'inline' : 'none';
  document.getElementById('aiLevelWrap').style.display = (isAi && eng!=='katago') ? 'inline' : 'none';
  document.getElementById('engineWrap').style.display = isAi ? 'inline' : 'none';
  document.getElementById('katagoWrap').style.display = (isAi && eng==='katago') ? 'inline' : 'none';
}

canvas.addEventListener('click', e=>{
  if(!started || scored) return;
  if(mode==='ai' && cur===aiColor) return; // 电脑回合，不响应点击
  const rect=canvas.getBoundingClientRect();
  const cw=getCw();
  const mx=(e.clientX-rect.left)*(cw/rect.width);
  const my=(e.clientY-rect.top)*(cw/rect.height);
  const pad=cw*0.045;
  const grid=(cw-2*pad)/(size-1);
  const x=Math.round((mx-pad)/grid);
  const y=Math.round((my-pad)/grid);
  if(x<0||y<0||x>=size||y>=size) return;
  const px=pad+x*grid, py=pad+y*grid;
  if(Math.hypot(mx-px, my-py) > grid*0.45) return;
  tryPlace(x,y);
});

document.getElementById('start').onclick=startGame;
document.getElementById('new').onclick=newGame;
document.getElementById('undo').onclick=undo;
document.getElementById('pass').onclick=pass;
document.getElementById('score').onclick=doScore;
document.getElementById('mode').onchange=()=>{ syncModeUI(); newGame(); };
document.getElementById('aiSide').onchange=newGame;
document.getElementById('aiLevel').onchange=newGame;
document.getElementById('engine').onchange=()=>{
  syncModeUI();
  if(document.getElementById('engine').value==='gnugo') loadGnuGo();
  newGame();
};
document.getElementById('katagoStrength').oninput=()=>{
  document.getElementById('katagoStrengthVal').textContent=document.getElementById('katagoStrength').value;
};
document.getElementById('size').onchange=newGame;
document.getElementById('handi').onchange=newGame;
window.addEventListener('resize', draw);
syncModeUI();
newGame();
</script>
